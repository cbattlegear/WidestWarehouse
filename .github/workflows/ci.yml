name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r loader/requirements.txt
          pip install pytest

      - name: Validate model
        run: python -m tools.generator.cli validate

      - name: Run tests
        run: python -m pytest tools/tests loader/tests -q

      # The version in the image must always be documented. Catching this on main is far
      # cheaper than discovering it when a release tag is rejected.
      - name: Assert the current version has changelog notes
        run: python -m tools.release.cli notes --version "$(python -m tools.release.cli current)" > /dev/null

      # sql/ is committed generated output. If it drifts from model/, the repository is
      # lying about its own schema.
      - name: Assert sql/ matches the model
        run: |
          python -m tools.generator.cli emit
          if ! git diff --exit-code -- sql/; then
            echo "::error::sql/ is out of date. Run scripts/rebuild_model.ps1 and commit the result."
            exit 1
          fi
